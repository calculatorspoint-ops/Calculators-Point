<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f6f3" />
    <title>You're offline | Calculators Point</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1d2d27; background: #f3f6f3; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 520px); padding: clamp(24px, 6vw, 40px); border: 1px solid #dce6df; border-radius: 24px; background: #fffefa; box-shadow: 0 12px 36px rgba(29,45,39,.08); text-align: center; }
      .icon { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; background: #e8f1ee; color: #216459; font-size: 28px; }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; }
      p { margin: 0; color: #3e574b; line-height: 1.65; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 22px; padding: 0 18px; border-radius: 12px; background: #216459; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #397f70; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">📴</div>
      <h1>You're offline</h1>
      <p>This page isn't saved on your device yet. Reconnect and open it once to make it available offline. Calculator pages you've already visited may still work.</p>
      <a href="/">Try the home page again</a>
    </main>
  </body>
</html>
